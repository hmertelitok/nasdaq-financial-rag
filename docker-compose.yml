services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: nasdaq-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nasdaq_financial_rag
    ports:
      - "5433:5432"
    volumes:
      - nasdaq_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nasdaq_financial_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nasdaq_pgvector_data:
    external: true