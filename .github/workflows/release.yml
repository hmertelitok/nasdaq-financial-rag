name: Build and Release for Users

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v2.1.3 gibi tag'lerde tetiklenir
  workflow_dispatch:  # Manuel olarak da tetikleyebilirsin

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write  # GitHub Releases'a dosya yüklemek için

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: .NET 8.0 SDK Kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================
      # 1. .NET API'yi Self-Contained Derle
      # ============================================
      - name: .NET API'yi Publish Et (Self-Contained)
        run: |
          dotnet publish .api/NasdaqFinancialRag.Api/NasdaqFinancialRag.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./publish/api
        shell: pwsh

      # ============================================
      # 2. Python App Paketle
      # ============================================
      - name: Python App Klasörünü Hazırla
        run: |
          mkdir publish/python-app
          Copy-Item -Path src, app, config -Destination publish/python-app -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path requirements.txt -Destination publish/python-app
          Copy-Item -Path docker-compose.yml -Destination publish/python-app
          Copy-Item -Path .env.example -Destination publish/python-app
        shell: pwsh

      - name: Python Başlatma Scripti Oluştur
        run: |
          $batContent = @"
          @echo off
          chcp 65001 >nul
          title Nasdaq Financial RAG - Python Servisleri
          color 0A
          
          echo.
          echo ========================================
          echo   NASDAQ FINANCIAL RAG
          echo   Python Servisleri Baslatiliyor
          echo ========================================
          echo.
          
          REM Virtual environment kontrol
          if not exist ".venv" (
              echo [1/3] Virtual environment olusturuluyor...
              python -m venv .venv
          )
          
          echo [2/3] Bagimliliklar yukleniyor...
          .venv\Scripts\pip.exe install -r requirements.txt
          
          echo [3/3] Servisler baslatiliyor...
          echo.
          echo FastAPI: http://127.0.0.1:8001
          echo Streamlit: http://localhost:8501
          echo.
          echo Kapatmak icin bu pencereyi kapatin.
          echo.
          
          REM FastAPI ve Streamlit'i ayrı pencerelerde başlat
          start "FastAPI Service" cmd /k ".venv\Scripts\python.exe -m uvicorn pgvector_search_service:app --app-dir src --host 127.0.0.1 --port 8001"
          timeout /t 3 /nobreak >nul
          start "Streamlit App" cmd /k ".venv\Scripts\python.exe -m streamlit run app\streamlit_app.py"
          
          pause
          "@
          $batContent | Out-File -FilePath "publish/python-app/baslat.bat" -Encoding UTF8
        shell: pwsh

      # ============================================
      # 3. ZIP Dosyaları Oluştur
      # ============================================
      - name: .NET API ZIP Oluştur
        run: Compress-Archive -Path ./publish/api/* -DestinationPath ./publish/Nasdaq-Dotnet-API.zip
        shell: pwsh

      - name: Python App ZIP Oluştur
        run: Compress-Archive -Path ./publish/python-app/* -DestinationPath ./publish/Nasdaq-Python-App.zip
        shell: pwsh

      # ============================================
      # 4. GitHub Releases'a Yükle
      # ============================================
      - name: GitHub Releases'a Yükle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Nasdaq-Dotnet-API.zip
            publish/Nasdaq-Python-App.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
