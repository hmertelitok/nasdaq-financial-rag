name: NASDAQ Financial RAG CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-dotnet:
    name: Build ASP.NET Core API
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore Dependencies
      run: dotnet restore api/NasdaqFinancialRag.Api/NasdaqFinancialRag.Api.csproj
      
    - name: Build Project
      run: dotnet build api/NasdaqFinancialRag.Api/NasdaqFinancialRag.Api.csproj --configuration Release --no-restore

  build-python:
    name: Check Python Services
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check Python Syntax
      run: |
        python -m compileall src/ app/ -q
